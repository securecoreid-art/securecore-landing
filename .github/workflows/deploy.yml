name: Build & Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and upload via FTPS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Check build output
        run: |
          test -f dist/index.html
          test -f dist/id/index.html
          test -f dist/.htaccess
          test -f dist/.well-known/security.txt
          test -f dist/api/contact.php
          test -f dist/api/.htaccess

      # Contact form → Google Sheet. Secrets never enter the repo:
      # they are written to dist/api/_config.php here and uploaded with the site.
      # (_config.php is blocked from web access by api/.htaccess and only executed by PHP.)
      - name: Write contact form config
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          FORM_SECRET: ${{ secrets.FORM_SECRET }}
        run: |
          php -r '
            $c = [
              "apps_script_url" => (string) getenv("APPS_SCRIPT_URL"),
              "secret"          => (string) getenv("FORM_SECRET"),
            ];
            file_put_contents("dist/api/_config.php", "<?php\nreturn " . var_export($c, true) . ";\n");
          '
          php -l dist/api/_config.php
          php -l dist/api/contact.php
          if [ -z "$APPS_SCRIPT_URL" ] || [ -z "$FORM_SECRET" ]; then
            echo "::warning::APPS_SCRIPT_URL / FORM_SECRET not set: form will use the email fallback only."
          fi

      - name: Deploy to cPanel (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        env:
          # The FTP host has IPv4 + IPv6, but GitHub runners have no IPv6.
          # Node's "happy eyeballs" gives each address only 250 ms, which is
          # shorter than the US→Indonesia round trip, so IPv4 times out.
          # Force a plain IPv4-first connect with the normal OS timeout.
          NODE_OPTIONS: --no-network-family-autoselection --dns-result-order=ipv4first
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
